<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃源镇 - AI 小镇模拟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #f093fb, #f5576c, #fda085);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .time-display {
            font-size: 18px;
            margin-top: 8px;
            color: #a0a0ff;
        }

        /* ─── 状态栏 ─── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            min-height: 44px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
            transition: all 0.3s;
        }

        .status-bar.busy {
            background: rgba(102, 126, 234, 0.15);
            border-bottom-color: rgba(102, 126, 234, 0.3);
        }

        .status-bar.done {
            background: rgba(67, 233, 123, 0.1);
            border-bottom-color: rgba(67, 233, 123, 0.2);
        }

        .status-bar.error {
            background: rgba(245, 87, 108, 0.15);
            border-bottom-color: rgba(245, 87, 108, 0.3);
        }

        .status-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status-bar.busy .status-spinner {
            display: inline-block;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }

        .status-bar.busy .status-dot { background: #667eea; box-shadow: 0 0 8px #667eea; }
        .status-bar.done .status-dot { background: #43e97b; box-shadow: 0 0 8px #43e97b; }
        .status-bar.error .status-dot { background: #f5576c; box-shadow: 0 0 8px #f5576c; }

        .status-text {
            color: #b0b0b0;
            transition: color 0.3s;
        }

        .status-bar.busy .status-text { color: #a0b0ff; }
        .status-bar.done .status-text { color: #80e0a0; }

        .mode-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .mode-badge.llm {
            background: rgba(240, 147, 251, 0.25);
            color: #f093fb;
            border: 1px solid rgba(240, 147, 251, 0.4);
        }

        .mode-badge.random {
            background: rgba(67, 233, 123, 0.2);
            color: #43e97b;
            border: 1px solid rgba(67, 233, 123, 0.3);
        }

        .elapsed-badge {
            display: none;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            background: rgba(102, 126, 234, 0.2);
            color: #a0b0ff;
            border: 1px solid rgba(102, 126, 234, 0.3);
            font-variant-numeric: tabular-nums;
        }

        /* ─── 进度条 ─── */
        .progress-track {
            height: 3px;
            background: rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea, #f093fb);
            transition: width 0.5s ease;
        }

        .progress-bar.indeterminate {
            width: 30%;
            animation: indeterminate 1.5s infinite ease-in-out;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes indeterminate {
            0% { margin-left: -30%; }
            100% { margin-left: 100%; }
        }

        /* ─── 控制按钮 ─── */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px;
        }

        .controls button {
            padding: 10px 24px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .btn-micro {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #333;
        }

        .btn-step {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-auto {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-day {
            background: linear-gradient(135deg, #fda085, #f6d365);
            color: #333;
        }

        .btn-day.pausing {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            color: white;
        }

        .btn-reset {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.2) !important;
        }

        .controls button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ─── 主布局 ─── */
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            gap: 16px;
            padding: 16px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 200px);
        }

        .panel {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .panel-title {
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .panel-body {
            padding: 12px;
            overflow-y: auto;
            max-height: calc(100vh - 280px);
        }

        /* ─── 居民卡片 ─── */
        .resident-card {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s;
        }

        .resident-card:hover {
            background: rgba(255,255,255,0.1);
        }

        .resident-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .resident-info {
            font-size: 12px;
            color: #a0a0a0;
            line-height: 1.6;
        }

        .resident-emotion {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            background: rgba(102, 126, 234, 0.3);
            margin-top: 4px;
        }

        /* ─── 地图 ─── */
        .town-map {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 12px;
        }

        .location-card {
            padding: 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            min-height: 100px;
            transition: all 0.3s;
        }

        .location-card.has-people {
            border-color: rgba(240, 147, 251, 0.4);
            background: rgba(240, 147, 251, 0.08);
        }

        .location-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .location-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .location-occupants {
            font-size: 12px;
            color: #c0c0c0;
        }

        .occupant-tag {
            display: inline-block;
            padding: 2px 8px;
            margin: 2px;
            border-radius: 8px;
            font-size: 11px;
            background: rgba(245, 87, 108, 0.3);
        }

        /* ─── 事件日志 ─── */
        .event-item {
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            background: rgba(255,255,255,0.03);
            border-left: 3px solid #667eea;
            animation: fadeIn 0.5s ease;
        }

        .event-item.conversation {
            border-left-color: #f093fb;
            background: rgba(240, 147, 251, 0.08);
        }

        .event-item.reflection {
            border-left-color: #fda085;
            background: rgba(253, 160, 133, 0.08);
        }

        .event-item.llm-call {
            border-left-color: #ffd700;
            background: rgba(255, 215, 0, 0.10);
        }
        .event-item.llm-call .llm-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ffb700);
            color: #333;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .event-item.system-msg {
            border-left-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            color: #a0b0ff;
            font-size: 12px;
        }

        .conversation-content {
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            font-size: 13px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #a0a0ff;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }

        /* ─── 步骤指示器 ─── */
        .step-phases {
            display: flex;
            gap: 4px;
            margin-left: 12px;
        }

        .phase-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: all 0.3s;
        }

        .phase-dot.active {
            background: #667eea;
            box-shadow: 0 0 6px #667eea;
        }

        .phase-dot.completed {
            background: #43e97b;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>桃源镇 · AI 小镇模拟</h1>
        <div class="time-display" id="timeDisplay">加载中...</div>
    </div>

    <!-- 模式标签 -->
    <div style="text-align:center; padding:4px 0 0 0;">
        <span class="mode-badge" id="modeBadge" style="display:none;"></span>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
        <div class="status-dot"></div>
        <div class="status-spinner"></div>
        <span class="status-text" id="statusText">就绪 - 点击按钮开始模拟</span>
        <span class="elapsed-badge" id="elapsedBadge"></span>
        <div class="step-phases" id="stepPhases" style="display:none;">
            <div class="phase-dot" id="phase1" title="调度居民"></div>
            <div class="phase-dot" id="phase2" title="居民交互"></div>
            <div class="phase-dot" id="phase3" title="推进时间"></div>
        </div>
    </div>

    <!-- 进度条 -->
    <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="controls">
        <button class="btn-micro" onclick="doMicroStep()" id="btnMicro">下一步</button>
        <button class="btn-step" onclick="doStep()" id="btnStep">下一个小时</button>
        <button class="btn-auto" onclick="autoRun()" id="btnAuto">自动运行</button>
        <button class="btn-day" onclick="runDay()" id="btnDay">运行一天</button>
        <button class="btn-reset" onclick="resetSim()" id="btnReset">重置</button>
    </div>

    <div class="main-grid">
        <!-- 左侧：居民列表 -->
        <div class="panel">
            <div class="panel-title">居民</div>
            <div class="panel-body" id="residentList">
                <div class="loading">加载中</div>
            </div>
        </div>

        <!-- 中间：小镇地图 -->
        <div class="panel">
            <div class="panel-title">桃源镇地图</div>
            <div class="panel-body">
                <div class="town-map" id="townMap">
                    <div class="loading">加载中</div>
                </div>
            </div>
        </div>

        <!-- 右侧：事件日志 -->
        <div class="panel">
            <div class="panel-title">事件日志</div>
            <div class="panel-body" id="eventLog">
                <div class="event-item system-msg">系统就绪，点击"下一步"开始模拟</div>
            </div>
        </div>
    </div>

    <script>
        const LOCATION_ICONS = {
            '老王面馆': '🍜',
            '小镇广场': '🏛️',
            '卫生所': '🏥',
            '桃源小学': '🏫',
            '赵大姐超市': '🏪',
            '镇公园': '🌳',
            '老王的家': '🏠',
            '小李的家': '💻',
            '张医生的家': '🏠',
            '陈老师的家': '🏠',
            '赵大姐的家': '🏠',
        };

        const RESIDENT_COLORS = {
            '老王': '#f5576c',
            '小李': '#667eea',
            '张医生': '#43e97b',
            '陈老师': '#fa709a',
            '赵大姐': '#fda085',
        };

        const PHASE_MAP = {
            'dispatch': { index: 1, label: '正在调度居民行为' },
            'interact': { index: 2, label: '正在处理居民交互' },
            'advance':  { index: 3, label: '正在推进时间' },
            'done':     { index: 4, label: '步骤完成' },
            'day_start':{ index: 0, label: '正在运行一整天' },
            'reset':    { index: 0, label: '正在重置' },
        };

        let isRunning = false;
        let isDayRunning = false;
        let ws = null;
        let useLLM = true;
        let stepCount = 0;
        let currentSimTime = '';
        let currentSimPeriod = '';
        let elapsedTimer = null;
        let elapsedStart = 0;
        let streamedEventCount = 0;  // 已通过实时流推送的事件数
        let nextMicroInfo = null;     // 缓存下一步的 agent/phase 信息

        function startElapsedTimer() {
            elapsedStart = performance.now();
            const badge = document.getElementById('elapsedBadge');
            badge.style.display = 'inline-block';
            badge.textContent = '0.0s';
            clearInterval(elapsedTimer);
            elapsedTimer = setInterval(() => {
                const s = ((performance.now() - elapsedStart) / 1000).toFixed(1);
                badge.textContent = s + 's';
            }, 100);
        }

        function stopElapsedTimer() {
            clearInterval(elapsedTimer);
            elapsedTimer = null;
            const badge = document.getElementById('elapsedBadge');
            setTimeout(() => { badge.style.display = 'none'; }, 2000);
        }

        function pickSimTime(data) {
            return data.sim_time || data.time || currentSimTime;
        }
        function pickSimPeriod(data) {
            return data.sim_period || currentSimPeriod || '';
        }

        // ─── 状态栏控制 ───
        function setStatus(state, text) {
            const bar = document.getElementById('statusBar');
            const textEl = document.getElementById('statusText');
            bar.className = 'status-bar ' + state; // 'busy', 'done', 'error', ''
            textEl.textContent = text;
        }

        function showPhases(show) {
            document.getElementById('stepPhases').style.display = show ? 'flex' : 'none';
            if (!show) {
                document.querySelectorAll('.phase-dot').forEach(d => {
                    d.className = 'phase-dot';
                });
            }
        }

        function updatePhase(phaseKey) {
            const info = PHASE_MAP[phaseKey];
            if (!info) return;

            // Update phase dots
            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById('phase' + i);
                if (i < info.index) {
                    dot.className = 'phase-dot completed';
                } else if (i === info.index) {
                    dot.className = 'phase-dot active';
                } else {
                    dot.className = 'phase-dot';
                }
            }
        }

        function setProgressBar(percent, indeterminate = false) {
            const bar = document.getElementById('progressBar');
            if (indeterminate) {
                bar.style.width = '';
                bar.className = 'progress-bar indeterminate';
            } else {
                bar.className = 'progress-bar';
                bar.style.width = percent + '%';
            }
        }

        function updateModeBadge() {
            const badge = document.getElementById('modeBadge');
            badge.style.display = 'inline-block';
            if (useLLM) {
                badge.className = 'mode-badge llm';
                badge.textContent = 'LLM 模式';
            } else {
                badge.className = 'mode-badge random';
                badge.textContent = '随机模式';
            }
        }

        function addSystemLog(text) {
            const container = document.getElementById('eventLog');
            const div = document.createElement('div');
            div.className = 'event-item system-msg';
            const sim = currentSimTime || '';
            div.textContent = sim ? `[${sim}] ${text}` : text;
            container.prepend(div);

            // 限制条数
            while (container.children.length > 100) {
                container.removeChild(container.lastChild);
            }
        }

        // ─── WebSocket ───
        function initWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'step_update') {
                    updateUI(msg.data);
                } else if (msg.type === 'status') {
                    renderInitialStatus(msg.data);
                } else if (msg.type === 'progress') {
                    handleProgress(msg.data);
                } else if (msg.type === 'phase_start') {
                    handlePhaseStart(msg.data);
                } else if (msg.type === 'micro_step') {
                    handleMicroStep(msg.data);
                } else if (msg.type === 'conversation_event') {
                    handleConversationEvent(msg.data);
                }
            };

            ws.onopen = () => {
                ws.send(JSON.stringify({ action: 'status' }));
                addSystemLog('WebSocket 已连接');
            };

            ws.onclose = () => {
                addSystemLog('WebSocket 断开，3秒后重连...');
                setTimeout(initWebSocket, 3000);
            };
        }

        function handleProgress(data) {
            const phase = data.phase;
            const detail = data.detail || '';
            const elapsed = data.elapsed || '';
            const info = PHASE_MAP[phase];

            // 构建状态文本：含耗时
            let statusText = detail || (info ? info.label : '');
            if (elapsed && phase !== 'done' && phase !== 'step_done' && phase !== 'paused') {
                statusText += ` (${elapsed})`;
            }

            if (phase === 'step_done') {
                // 单步完成 — 如果正在 day-run 或 auto-run，只清除阶段指示，不重置整体状态
                if (isDayRunning || isRunning) {
                    showPhases(false);
                } else {
                    setStatus('done', detail || '完成');
                    setProgressBar(100);
                    showPhases(false);
                    stopElapsedTimer();
                    setTimeout(() => {
                        setStatus('', '就绪');
                        setProgressBar(0);
                    }, 1500);
                }
            } else if (phase === 'done') {
                setStatus('done', detail || '完成');
                setProgressBar(100);
                showPhases(false);
                stopElapsedTimer();
                isDayRunning = false;
                updateDayButton();
                setTimeout(() => {
                    setStatus('', '就绪');
                    setProgressBar(0);
                }, 1500);
            } else if (phase === 'paused') {
                setStatus('done', detail || '已暂停');
                setProgressBar(0);
                showPhases(false);
                stopElapsedTimer();
                isDayRunning = false;
                updateDayButton();
                setButtonsDisabled(false);
            } else if (phase === 'day_running') {
                setStatus('busy', statusText);
                showPhases(true);
                setProgressBar(0, true);
            } else if (info) {
                setStatus('busy', statusText);
                showPhases(true);
                updatePhase(phase);
                const progressMap = { 'dispatch': 20, 'interact': 60, 'advance': 90 };
                setProgressBar(progressMap[phase] || 50);
            }
        }

        const LLM_PHASES = new Set(['plan', 'reflect']);
        const LLM_EVENT_TAGS = ['[计划]', '[对话]', '[反思]'];

        function isLlmEvent(text) {
            return LLM_EVENT_TAGS.some(tag => text.includes(tag));
        }

        function handlePhaseStart(data) {
            // 阶段开始前的状态显示
            if (data.agent_name && data.phase_label) {
                if (data.is_llm) {
                    setStatus('busy', `${data.agent_name} 正在${data.phase_label} 🤖（调用LLM中）`);
                } else {
                    setStatus('busy', `${data.agent_name} 正在${data.phase_label}`);
                }
            }
        }

        function handleMicroStep(data) {
            // 阶段完成后：更新事件、卡片、地图（不覆盖状态栏，phase_start 已设置）
            const isLlmPhase = LLM_PHASES.has(data.phase);
            if (data.events && data.events.length > 0) {
                appendEvents(data.events, isLlmPhase);
                scrollEventLogToTop();
                streamedEventCount += data.events.length;
            }
            if (data.agent_state && data.agent_name) {
                updateSingleResident(data.agent_name, data.agent_state);
            }
            if (data.location_states) {
                updateMap(data.location_states);
            }
        }

        function handleConversationEvent(data) {
            // 实时追加对话事件和内容
            if (data.event) {
                appendEvents([data.event]);
                streamedEventCount += 1;
            }
            if (data.conversation) {
                appendConversations([data.conversation]);
                streamedEventCount += 1;
            }
            scrollEventLogToTop();
        }

        function scrollEventLogToTop() {
            const container = document.getElementById('eventLog');
            container.scrollTop = 0;
        }

        function updateSingleResident(name, info) {
            const container = document.getElementById('residentList');
            const color = RESIDENT_COLORS[name] || '#667eea';

            // 查找已有卡片
            let card = null;
            for (const c of container.children) {
                const nameEl = c.querySelector('.resident-name');
                if (nameEl && nameEl.textContent === name) {
                    card = c;
                    break;
                }
            }

            const html = `
                <div class="resident-name" style="color:${color}">${name}</div>
                <div class="resident-info">
                    ${info.occupation || info.age + '岁'}<br>
                    📍 ${info.current_location}<br>
                    🎯 ${info.current_activity}
                </div>
                <span class="resident-emotion">${info.current_emotion || '平静'}</span>
            `;

            if (card) {
                card.innerHTML = html;
                // 闪烁高亮
                card.style.transition = 'box-shadow 0.3s';
                card.style.boxShadow = `0 0 12px ${color}88`;
                setTimeout(() => { card.style.boxShadow = ''; }, 800);
            } else {
                card = document.createElement('div');
                card.className = 'resident-card';
                card.innerHTML = html;
                container.appendChild(card);
            }
        }

        // ─── 渲染 ───
        function renderInitialStatus(data) {
            currentSimTime = data.clock.time_str || '';
            currentSimPeriod = data.clock.period || '';
            document.getElementById('timeDisplay').textContent =
                `${currentSimTime} · ${currentSimPeriod}`;
            renderResidents(data.residents);
            renderMap(data.town.locations);

            // 读取模式
            if (data.use_llm !== undefined) {
                useLLM = data.use_llm;
                updateModeBadge();
            }

            setStatus('done', '数据加载完成');
            setTimeout(() => setStatus('', '就绪'), 1500);
        }

        function updateUI(data) {
            const simTime = pickSimTime(data);
            const simPeriod = pickSimPeriod(data);
            if (simTime) currentSimTime = simTime;
            if (simPeriod) currentSimPeriod = simPeriod;
            document.getElementById('timeDisplay').textContent =
                `${simTime}${simPeriod ? ' · ' + simPeriod : ''}`;
            stepCount++;

            if (data.agent_states) {
                renderResidents(data.agent_states);
            }
            if (data.location_states) {
                updateMap(data.location_states);
            }
            // 如果事件已通过实时流推送，跳过重复追加
            if (streamedEventCount > 0) {
                streamedEventCount = 0;
            } else {
                if (data.events) {
                    appendEvents(data.events);
                }
                if (data.conversations && data.conversations.length > 0) {
                    appendConversations(data.conversations);
                }
            }
        }

        function renderResidents(residents) {
            const container = document.getElementById('residentList');
            container.innerHTML = '';

            for (const [name, info] of Object.entries(residents)) {
                const color = RESIDENT_COLORS[name] || '#667eea';
                const card = document.createElement('div');
                card.className = 'resident-card';
                card.innerHTML = `
                    <div class="resident-name" style="color:${color}">${name}</div>
                    <div class="resident-info">
                        ${info.occupation || info.age + '岁'}<br>
                        📍 ${info.current_location}<br>
                        🎯 ${info.current_activity}
                    </div>
                    <span class="resident-emotion">${info.current_emotion || '平静'}</span>
                `;
                container.appendChild(card);
            }
        }

        function renderMap(locations) {
            const container = document.getElementById('townMap');
            container.innerHTML = '';

            for (const [name, info] of Object.entries(locations)) {
                const icon = LOCATION_ICONS[name] || '📍';
                const occupants = info.occupants || [];
                const card = document.createElement('div');
                card.className = 'location-card' + (occupants.length > 0 ? ' has-people' : '');
                card.id = `loc-${name}`;

                const occupantTags = occupants.map(o => {
                    const color = RESIDENT_COLORS[o] || '#667eea';
                    return `<span class="occupant-tag" style="background:${color}33; color:${color}">${o}</span>`;
                }).join('');

                card.innerHTML = `
                    <div class="location-icon">${icon}</div>
                    <div class="location-name">${name}</div>
                    <div class="location-occupants">
                        ${occupantTags || '<span style="color:#555">空</span>'}
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function updateMap(locationStates) {
            for (const [name, occupants] of Object.entries(locationStates)) {
                const card = document.getElementById(`loc-${name}`);
                if (!card) continue;

                card.className = 'location-card' + (occupants.length > 0 ? ' has-people' : '');
                const occDiv = card.querySelector('.location-occupants');
                if (occDiv) {
                    const tags = occupants.map(o => {
                        const color = RESIDENT_COLORS[o] || '#667eea';
                        return `<span class="occupant-tag" style="background:${color}33; color:${color}">${o}</span>`;
                    }).join('');
                    occDiv.innerHTML = tags || '<span style="color:#555">空</span>';
                }
            }
        }

        function appendEvents(events, forceIsLlm) {
            const container = document.getElementById('eventLog');

            for (const event of events) {
                const div = document.createElement('div');
                let cls = 'event-item';
                const llm = forceIsLlm || isLlmEvent(event);
                if (event.includes('[对话]')) cls += ' conversation';
                if (event.includes('[反思]')) cls += ' reflection';
                if (llm) cls += ' llm-call';

                let text = event;
                const hasStamp = /^\[\d{2}:\d{2}\]/.test(event);
                if (!hasStamp && currentSimTime) {
                    const parts = currentSimTime.split(' ');
                    const hh = parts.length > 1 ? parts[parts.length - 1] : currentSimTime;
                    text = `[${hh}] ${event}`;
                }

                div.className = cls;
                if (llm) {
                    div.innerHTML = escapeHtml(text) + '<span class="llm-badge">LLM</span>';
                } else {
                    div.textContent = text;
                }
                container.prepend(div);
            }

            while (container.children.length > 100) {
                container.removeChild(container.lastChild);
            }
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function appendConversations(conversations) {
            const container = document.getElementById('eventLog');

            for (const conv of conversations) {
                const div = document.createElement('div');
                div.className = 'event-item conversation llm-call';
                let stamp = '';
                if (conv.time) {
                    const parts = String(conv.time).split(' ');
                    stamp = parts.length > 1 ? parts[parts.length - 1] : conv.time;
                }
                const stampStr = stamp ? `[${stamp}] ` : '';
                div.innerHTML = `
                    <strong>💬 ${stampStr}${conv.participants.join(' & ')} 在${conv.location}的对话</strong><span class="llm-badge">LLM</span>
                    <div class="conversation-content">${conv.content}</div>
                `;
                container.prepend(div);
            }
        }

        // ─── 控制按钮 ───
        function updateDayButton() {
            const btn = document.getElementById('btnDay');
            if (isDayRunning) {
                btn.textContent = '⏸ 暂停';
                btn.className = 'btn-day pausing';
            } else {
                btn.textContent = '运行一天';
                btn.className = 'btn-day';
            }
        }

        const MICRO_PHASE_LABELS = {
            perceive: '感知', plan: '计划', act: '行动',
            interact: '交互', advance: '推进时间', reflect: '反思'
        };

        async function doMicroStep() {
            setButtonsDisabled(true);
            // 显示当前正在执行的 agent/phase
            if (nextMicroInfo && nextMicroInfo.agent_name) {
                const pl = MICRO_PHASE_LABELS[nextMicroInfo.phase_name] || nextMicroInfo.phase_name || '';
                if (LLM_PHASES.has(nextMicroInfo.phase_name)) {
                    setStatus('busy', `${nextMicroInfo.agent_name} 正在${pl} 🤖（调用LLM中）`);
                } else {
                    setStatus('busy', `${nextMicroInfo.agent_name} 正在${pl}`);
                }
            } else {
                setStatus('busy', '正在执行...');
            }

            try {
                const res = await fetch('/api/micro_step', { method: 'POST' });
                const data = await res.json();
                const r = data.result;
                const phaseLabel = MICRO_PHASE_LABELS[r.phase] || r.phase;
                const agentLabel = r.agent_name ? `${r.agent_name}` : '';
                const isLlm = LLM_PHASES.has(r.phase);
                const llmTag = isLlm ? ' 🤖LLM' : '';
                const info = r.micro_info || {};

                // 缓存下一步信息
                nextMicroInfo = info;

                if (r.finished_hour) {
                    setStatus('done', `✅ ${agentLabel} ${phaseLabel} 完成 — 本小时结束`);
                    nextMicroInfo = null;
                    setTimeout(() => setStatus('', '就绪'), 1500);
                } else {
                    const nextAgent = info.agent_name || '';
                    const nextPhase = MICRO_PHASE_LABELS[info.phase_name] || info.phase_name || '';
                    const nextIsLlm = LLM_PHASES.has(info.phase_name);
                    const nextLlmTag = nextIsLlm ? ' 🤖' : '';
                    setStatus('done', `✅ ${agentLabel} ${phaseLabel} 完成 → 下一步: ${nextAgent} ${nextPhase}${nextLlmTag}`);
                }
            } catch (e) {
                console.error(e);
                setStatus('error', '执行出错: ' + e.message);
            }

            setButtonsDisabled(false);
        }

        async function doStep() {
            setButtonsDisabled(true);
            setStatus('busy', '正在模拟下一个小时...');
            showPhases(true);
            setProgressBar(10);
            startElapsedTimer();
            await fetch('/api/clear_pause', { method: 'POST' });
            addSystemLog('开始模拟下一个小时');

            try {
                const res = await fetch('/api/step', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'error') {
                    setStatus('error', '执行出错: ' + data.message);
                    addSystemLog('执行出错: ' + data.message);
                } else {
                    updateUI(data.state);
                }
            } catch (e) {
                console.error(e);
                setStatus('error', '执行出错: ' + e.message);
                addSystemLog('执行出错: ' + e.message);
            }

            stopElapsedTimer();
            showPhases(false);
            setButtonsDisabled(false);
        }

        async function autoRun() {
            if (isRunning) {
                // 发送暂停信号，让后端中断当前 step
                try {
                    await fetch('/api/pause_day', { method: 'POST' });
                } catch (e) {
                    console.error(e);
                }
                isRunning = false;
                addSystemLog('正在暂停...');
                return;
            }

            isRunning = true;
            document.getElementById('btnAuto').textContent = '⏸ 暂停';
            document.getElementById('btnMicro').disabled = true;
            document.getElementById('btnStep').disabled = true;
            document.getElementById('btnDay').disabled = true;
            document.getElementById('btnReset').disabled = true;
            startElapsedTimer();
            await fetch('/api/clear_pause', { method: 'POST' });
            addSystemLog('开始自动运行');

            let step = 0;
            while (isRunning) {
                step++;
                setStatus('busy', `自动运行中（第 ${step} 步）...`);

                try {
                    const res = await fetch('/api/step', { method: 'POST' });
                    const data = await res.json();
                    if (data.status === 'paused') {
                        addSystemLog('自动运行已暂停');
                        break;
                    }
                    if (data.state) updateUI(data.state);
                    await new Promise(r => setTimeout(r, 500));
                } catch (e) {
                    console.error(e);
                    isRunning = false;
                    setStatus('error', '自动运行出错: ' + e.message);
                    addSystemLog('自动运行出错: ' + e.message);
                }
            }

            isRunning = false;
            document.getElementById('btnAuto').textContent = '自动运行';
            stopElapsedTimer();
            setButtonsDisabled(false);
        }

        async function runDay() {
            // 如果正在运行一天，点击变为暂停
            if (isDayRunning) {
                try {
                    await fetch('/api/pause_day', { method: 'POST' });
                    addSystemLog('正在暂停...');
                } catch (e) {
                    console.error(e);
                }
                return;
            }

            isDayRunning = true;
            updateDayButton();
            document.getElementById('btnMicro').disabled = true;
            document.getElementById('btnStep').disabled = true;
            document.getElementById('btnAuto').disabled = true;
            document.getElementById('btnReset').disabled = true;
            setStatus('busy', '正在运行一整天的模拟...');
            setProgressBar(0, true);
            startElapsedTimer();
            addSystemLog('开始运行一整天');

            try {
                const res = await fetch('/api/run_day', { method: 'POST' });
                const data = await res.json();

                // 刷新状态
                const statusRes = await fetch('/api/status');
                const status = await statusRes.json();
                renderInitialStatus(status);

                if (data.status === 'paused') {
                    addSystemLog('一天模拟已暂停');
                } else {
                    addSystemLog('一天模拟已完成');
                }
            } catch (e) {
                console.error(e);
                setStatus('error', '运行出错: ' + e.message);
                addSystemLog('运行一天出错: ' + e.message);
            }

            isDayRunning = false;
            updateDayButton();
            stopElapsedTimer();
            setButtonsDisabled(false);
        }

        async function resetSim() {
            setButtonsDisabled(true);
            setStatus('busy', '正在重置...');
            addSystemLog('开始重置模拟');

            try {
                await fetch('/api/reset', { method: 'POST' });

                document.getElementById('eventLog').innerHTML =
                    '<div class="event-item system-msg">模拟已重置，点击"下一步"开始</div>';

                const res = await fetch('/api/status');
                const data = await res.json();
                renderInitialStatus(data);

                stepCount = 0;
                addSystemLog('重置完成');
            } catch (e) {
                setStatus('error', '重置失败: ' + e.message);
            }

            setButtonsDisabled(false);
        }

        function setButtonsDisabled(disabled) {
            document.getElementById('btnMicro').disabled = disabled;
            document.getElementById('btnStep').disabled = disabled;
            document.getElementById('btnReset').disabled = disabled;
            // Don't disable Day button when it's in pause mode (isDayRunning)
            if (!isDayRunning) {
                document.getElementById('btnDay').disabled = disabled;
            }
            // Don't disable Auto button when it's in pause mode (isRunning)
            if (!isRunning) {
                document.getElementById('btnAuto').disabled = disabled;
            }
        }

        // ─── 初始化 ───
        window.addEventListener('load', async () => {
            try {
                setStatus('busy', '正在加载初始数据...');
                setProgressBar(0, true);
                const res = await fetch('/api/status');
                const data = await res.json();
                renderInitialStatus(data);
            } catch (e) {
                console.error('Failed to load initial status:', e);
                setStatus('error', '加载失败，请刷新页面');
            }
            initWebSocket();

        });
    </script>
</body>
</html>
